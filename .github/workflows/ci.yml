name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Check generated interface and formatting
        if: matrix.target == 'wasm'
        run: |
          moon info
          moon fmt --check
          git diff --exit-code
      - name: Check and test
        run: |
          moon check -d --target ${{ matrix.target }}
          moon build -d --target ${{ matrix.target }}
          moon test --target ${{ matrix.target }}

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/crossref-fixtures/package-lock.json
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate official-format fixtures
        run: node tools/official-fixtures/generate.mjs
      - name: Regenerate third-party cross-reference fixtures
        working-directory: tools/crossref-fixtures
        run: |
          npm ci
          npm run generate
      - name: Live cross-process interoperability check
        working-directory: tools/crossref-fixtures
        run: npm run crosscheck
      - name: Format generated MoonBit tests
        run: moon fmt
      - name: Verify checked-in fixtures are reproducible
        run: git diff --exit-code -- official_format_test.mbt golden_fixtures_test.mbt

  official-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned official Java RoaringBitmap jar
        run: |
          mkdir -p tools/official-crosscheck/lib
          curl -fsSL -o tools/official-crosscheck/lib/RoaringBitmap-1.6.30.jar \
            https://repo1.maven.org/maven2/org/roaringbitmap/RoaringBitmap/1.6.30/RoaringBitmap-1.6.30.jar
          echo "6b25756b77a7f56da2428f9eef6ba6a56b614617  tools/official-crosscheck/lib/RoaringBitmap-1.6.30.jar" | sha1sum -c -
      - name: Live cross-process check against the official Java implementation
        run: node tools/official-crosscheck/crosscheck.mjs

  go-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tools/go-crosscheck/go.sum
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Live cross-process check against the official Go implementation
        run: node tools/go-crosscheck/crosscheck.mjs
